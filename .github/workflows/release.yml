name: Build & Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jdk'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleFossDebug --no-daemon

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          release_name: "iKit Tool v1.0.0"
          body: |
            ## iKit Tool v1.0.0

            Initial release of iKit Tool — Advanced Image Editor for Android.

            ### What's new
            - Rebranded from source with new identity
            - Deep purple (#7C4DFF) theme
            - New app icon
            - Updated PRO badge in top bar
            - iKit Tool branding throughout

            ### Install
            Download the APK below and install directly on your Android device.
            (Enable "Install from unknown sources" in settings if prompted)
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          asset_name: iKitTool-v1.0.0-debug.apk
          asset_content_type: application/vnd.android.package-archive
